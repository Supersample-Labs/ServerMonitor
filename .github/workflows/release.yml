name: Publish Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          skip-lts-prepass: true
      - name: Read release version
        id: version
        run: |
          [xml]$project = Get-Content ServerMonitor.csproj
          $releaseVersion = [string]$project.Project.PropertyGroup.Version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable three-part release version.' }
          "tag=v$releaseVersion" >> $env:GITHUB_OUTPUT
          "folder=ServerMonitor-v$releaseVersion-win-x64" >> $env:GITHUB_OUTPUT
      - name: Restore locked dependencies
        run: |
          dotnet restore ServerMonitor.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed.' }
      - name: Publish self-contained Windows x64 application
        env:
          RELEASE_FOLDER: ${{ steps.version.outputs.folder }}
        run: |
          dotnet publish ServerMonitor.csproj -c Release -r win-x64 --self-contained true --no-restore -o "Release/$env:RELEASE_FOLDER"
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed.' }
          Copy-Item README.md,THIRD-PARTY-NOTICES.txt "Release/$env:RELEASE_FOLDER/"
      - name: Test published executable
        env:
          RELEASE_FOLDER: ${{ steps.version.outputs.folder }}
        run: |
          $executable = Join-Path (Get-Location) "Release/$env:RELEASE_FOLDER/ServerMonitor.exe"
          $test = Start-Process -FilePath $executable -ArgumentList '--self-test' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(120000)) { Stop-Process -Id $test.Id; throw 'Self-tests exceeded two minutes.' }
          Get-Content "Release/$env:RELEASE_FOLDER/ServerMonitor-selftest.log"
          if ($test.ExitCode -ne 0) { throw "Self-tests failed: exit $($test.ExitCode)." }
      - name: Package binary, source, and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_FOLDER: ${{ steps.version.outputs.folder }}
        run: |
          $runtimeFiles = @('ServerMonitor.exe','README.md','THIRD-PARTY-NOTICES.txt') | ForEach-Object { "Release/$env:RELEASE_FOLDER/$_" }
          Compress-Archive -LiteralPath $runtimeFiles -DestinationPath "Release/$env:RELEASE_FOLDER.zip"
          git archive --format=zip --prefix="ServerMonitor-$env:RELEASE_TAG-source/" --output="Release/ServerMonitor-$env:RELEASE_TAG-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          $archives = @("Release/$env:RELEASE_FOLDER.zip", "Release/ServerMonitor-$env:RELEASE_TAG-source.zip")
          $checksums = foreach ($archive in $archives) { $hash = Get-FileHash -LiteralPath $archive -Algorithm SHA256; "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($archive))" }
          Set-Content -LiteralPath "Release/ServerMonitor-$env:RELEASE_TAG-SHA256SUMS.txt" -Value $checksums -Encoding ascii
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_FOLDER: ${{ steps.version.outputs.folder }}
        run: |
          gh release create $env:RELEASE_TAG "Release/$env:RELEASE_FOLDER.zip" "Release/ServerMonitor-$env:RELEASE_TAG-source.zip" "Release/ServerMonitor-$env:RELEASE_TAG-SHA256SUMS.txt" --target $env:GITHUB_SHA --title "Server Monitor $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed. Inspect any draft before retrying.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the uploaded draft failed.' }
